services:
  - type: web
    name: task-manager-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
